[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncflow"
version = "0.1.0"
description = "Async task processing system with FastAPI, RabbitMQ, and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aio-pika>=9.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
asyncflow-api = "app.api.main:main"
asyncflow-worker = "app.workers.worker:main"

[tool.setuptools.packages.find]
# Only the application package is installable. Without this, setuptools'
# flat-layout auto-discovery also finds migrations/ and refuses to build.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]  # Alembic-autogenerated, not hand-maintained

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = [
    "B008",  # FastAPI's Depends(...) as a default argument is idiomatic, not a bug
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
